services:
  gps-viewer:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    environment:
      DATA_FILE: /app/data/log_file_test_01.bin
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',8080)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
